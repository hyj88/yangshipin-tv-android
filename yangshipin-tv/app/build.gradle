plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ysptv.player'
    compileSdk 34

    // 本机已装 36.0.0，直接用（aapt2 向后兼容编译 android-34）
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.ysptv.player"
        // 24 = Android 7.0。
        //
        // 一路走过来的三个版本（别再倒回去）：
        //   minSdk 19（1.4 及以前） 为 4.4 留门，换来「不许用 API 21+ 类型」
        //                          「图标不许用矢量」两条重纪律。
        //   minSdk 21（1.5）        放弃 4.4；但 5.0/5.1/6.0 上 WebView 未必升过，
        //                          所以还得留一整页「内核能力体检」来解释为什么黑屏。
        //   minSdk 24（1.6）        **老设备整体不伺候了**。
        //
        // 为什么这次直接跳到 7.0：
        //   央视频直播硬依赖 MSE + WebAssembly + fetch，最低内核 **Chrome 57**（2017 年）。
        //   7.0 起 WebView 是独立可更新的 APK，且这批设备在役的 WebView 几乎都远高于 57；
        //   而 5.0/6.0 那批是「装得上、但内核可能停在 Chromium 37」——
        //   为了它们，要一直养着一页能力体检 + 一整套老设备回归用例。
        //   既然明确不为老设备负责，这整条降级路径就该删干净，而不是继续养着。
        //
        // 1.6 因此删掉的东西：
        //   · MainActivity 的「内核能力体检」：checkBrowserCapability() /
        //     showCapabilityError() / yspBridge.onCapability() / capabilityChecked /
        //     capabilityFailed，以及只为它存在的 loadingTitle / loadingHint 两个字段
        //   · TvShellActivity.realEngineVersion()（只被那页提示用过）
        //   · tools/legacy_capability_test.mjs（已移到 /tmp/ysp_removed/）
        //   7.0 以下现在装不上，安装器直接拒绝，也不再有「装上但黑屏」的中间态。
        //
        // ⚠️ 提到 24 **不等于** API 隔离可以删。**Api28 / Api30 必须留着**：
        //    24 < 28 < 30，跑在 7.0（API 24）上的设备加载含 API 30 类型的类，
        //    照样是 NoClassDefFoundError（Dalvik 在**类加载**阶段就解析方法签名，
        //    `if (SDK_INT >= X)` 只挡执行、挡不住解析）。
        //    隔离线跟着 minSdk 走：minSdk 24 → 隔离线是 28 和 30。
        //
        // 顺带：minSdk ≥ 21 时 AAPT2 不再把矢量图烘成各密度 PNG，图标保持矢量（见 README §26）；
        //       minSdk ≥ 24 时 v2 签名已覆盖全部目标设备（v1 不再是硬要求，但默认仍会签）。
        minSdk 24
        targetSdk 34
        // ⚠️ 必须显式关掉 multi-dex。
        //    minSdk 提到 21 之后 AGP **默认把 multiDexEnabled 打开**（5.0 起 ART 原生支持
        //    多 dex，AGP 就自作主张分包了），实测产物从「单 classes.dex 98,460 B」
        //    变成「classes.dex 2,972 + classes2.dex 95,704」。
        //    我们总共十来个类、方法数离 65K 差得远，根本不需要分包，付的却是实打实的代价：
        //      ① 首次安装后要额外 dexopt 一个 dex，冷启动变慢；
        //         phone_touch_test 的两条早期用例因此落在「页面还没稳」的窗口里，
        //         1.4（单 dex）22/22、1.5（分包）20/22 —— 同一台设备、同样的起始状态。
        //      ② 最低那批设备正好是 5.0/5.1（API 21/22），而 ART 在多 dex 上
        //         出过的类加载问题恰恰集中在 21~22 这两个版本上，白白多一处风险。
        //    关掉之后回到单 dex，与 1.4 行为一致。（能成功关掉本身也证明了没超方法数。）
        multiDexEnabled false
        // 版本：1.0 = 央视频主界面；1.1 = 加自定义源；1.2 = 修「分组 tab 太多时不跟随选中项」
        // （1.1 打包之后才被真实清单测出来的，见 README §20。1.1 没对外发过，但仍单独留档，
        //   免得出现两个内容不同、名字都叫 1.1 的包。）
        // 1.3 = 「从网址导入」：局域网导入页可以直接填一份清单的网址，由 App 去抓；
        //       抓成功就把这个地址记住，电视上多出一项「刷新远程清单」。
        // 1.4 = 镜像自动顺延：同一台名有多路地址时，播不通自动换下一路，
        //       走到上限或没得走了才报失败。
        // 1.5 = 放弃 Android 4.4（minSdk 19 → 21）：删掉 Api21 隔离类、清掉所有低版本
        //       SDK_INT 守卫、能力体检不再有「只能换设备」那条出路、图标改回矢量图。
        // 1.5.1 = 补「自定义源」可见入口：选台面板顶部常驻一行，遥控器可达。
        //       起因是「功能一直正常，用户却找不到」—— Google TV 桌面会把同一包名的
        //       多个 leanback 入口聚合成一张卡片，桌面那张「自定义源」卡片根本不出现，
        //       只剩蓝键 / 长按菜单键这两个隐藏操作。详见 MainActivity 的注释。
        // 1.6   = 老设备整体不伺候了：minSdk 21 → 24（Android 7.0），
        //        并删掉整条「内核能力体检」降级路径（7.0 以下装不上，也不再给提示）。
        // 1.7   = 换台节流：修「连按上下键会把站点播放器永久敲死」。
        //        站点自研 WASM HLS 播放器换台时走 detachMedia → moduleActive，
        //        高频连按会读到一个 null 的 .length 抛 TypeError，把「卸旧源→挂新源」
        //        拦腰截断，video.src 被清空后再也挂不上（再点任意行也救不回来）。
        //        实测 120ms 连按 6 次约 1/6 概率死亡；改成 1.5s 阀门 + 只保留最后目标后，
        //        治疗组 0/N 死亡、对照组仍有死亡。详见 inject.js 的 SWITCH_GAP_MS 注释。
        // 1.8   = 自定义源页补上「＋ 添加自定义源」可见入口：复用 inject.js 的入口机制，
        //        动作换成打开本页「源管理」（1.5.1 时那边不挂入口是因为动作是开
        //        CustomActivity、挂上就是自指）。起因是用户反馈「没有添加自定义源的位置」。
        //        顺带修了 move() 的一个潜在 bug：入口条件从 d < 0 收紧为 d === -1，
        //        否则 custom.js 的 resetCursor(toTop)（move(-9999) 回顶）光标本在
        //        第 0 行时会粘在入口上下不来。
        // 1.9   = 三处按用户反馈的减法 + 一处加法：
        //        ① 桌面上只留一个图标：CustomActivity 注销 LEANBACK/LAUNCHER 入口
        //           （以前装完出现「央视频TV」「自定义源」两张卡，而这两个本来就是
        //            一件事的两面；§29 早说过 Google TV 会把同包名入口聚合成一张卡）；
        //        ② 去掉内置示例源（5 条公开测试流）与「恢复内置示例源」菜单项
        //           —— 零源成为默认状态，进页面直接弹「源管理」，并由原生状态层
        //           常驻一条提示（浮层关掉后没有源的面板连开都开不起来）；
        //        ③ 电视端源管理新增「从剪贴板导入」：电视上没有「粘贴」这个动作，
        //           屏上键盘敲六七十个字符的清单网址不现实；剪贴板是唯一顺手的路。
        versionCode 14
        versionName "1.12"

        // ---- 1.10：手机上「源管理」里的菜单项点了没反应 ----
        // 起因：用户反馈手机上「从剪贴板导入」「屏上输入新源」鼠标点击没反应。
        // 根因不是这两项特殊，是**整个浮层从来没绑过任何点击事件** ——
        // 菜单和屏上键盘都是纯键盘驱动（全靠 CustomActivity 把遥控器 DPAD/OK
        // 翻成 key('UP'/'DOWN'/'OK')）。电视上遥控器把一切都代劳了，
        // 这个洞在电视测试里永远看不见；手机上没有遥控器，于是所有只能手点的
        // 项一个都点不动。
        // 本版补：浮层点击委托（data-i / data-r / data-c 反查）、触摸设备布局
        // 与 touch-action、pointerdown/click 去重，以及 §34 记的那个变量遮蔽坑。
        //
        // ---- 1.11：订阅源的删除（用户反馈「只能添加，失效的订阅源不能处理」）----
        // ① Source 加 from 字段（这一条来自哪份清单）—— 这是退订与同步删除的地基；
        // ② 「刷新远程清单」改名「同步这份清单」，语义从【只增不减】变成【按上游现状同步】：
        //    上游下架/改名的台会被删掉（用户要的就是这个）；
        // ③ 菜单新增「退订这份清单」：删掉它带来的全部源 + 忘掉地址；
        // ④ 边界（最要紧）：只删 from == 这份清单的；自己手加的、从别的清单加的一概不碰。
        //    1.10 及以前导入的条目没有 from → 第一次同步不删任何东西（宁可先不删，
        //    也不能把 172 条真台当垃圾清掉），但会就地补上标记，之后就正常同步了。
        //
        // ---- 1.12：换台防抖（用户反馈「上下换台不要立即切换，等一下就不卡了」）----
        // 用户想的是「固定延迟 1 秒」，实测那会让手感更差（停下按键→出画
        // 1383ms → 1873ms）。改成【防抖】：连续按只移光标，停下来 250ms 才换
        // 最后一台 —— 少切几台的好处拿到了，一秒的额外延迟没有。
        // 关键实现细节：防抖挂起期间 switchWant 还是 -1（车没进阀门），
        // 所以move() 的续算基点必须同时认 debWant，否则连按的位移会被吞。
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // 未配正式签名，先用 debug 签名产出可安装包
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 纯 Android Framework 实现，不引入任何第三方 / AndroidX 依赖，
// 既减小体积，也避免依赖解析失败。
dependencies {
}
