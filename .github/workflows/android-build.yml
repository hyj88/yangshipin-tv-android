name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ⚠️ 不要用 android-actions/setup-android：它内部会执行
      #    `sdkmanager tools`，而 'tools' 包早已从 Android SDK 仓库下架，
      #    必然以 "Failed to find package 'tools'" 失败（exit 1），
      #    整个 run 红在"Set up Android SDK"这一步。
      #    ubuntu-latest 镜像本身就带 Android SDK 与 cmdline-tools，
      #    直接装我们要用的那两个包就行。
      - name: Accept Android SDK licenses
        run: |
          SM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          "$SM" "platforms;android-34" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: yangshipin-tv
        run: bash ./build.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yangshipin-tv-debug
          path: yangshipin-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
